<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-label="hslice token economy and latency benchmark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#131922"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ea043"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>

  <rect width="880" height="340" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>

  <text x="28" y="34" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600">
    hslice Benchmark — AI Coding Agent Context &amp; Latency (Measured, 25-Run Median)
  </text>
  <text x="28" y="54" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12">
    Reproducible via scripts/bench_token_economy.py · Baseline = 4-turn find + grep + full-file read + caller grep
  </text>

  <!-- Left panel: Token Consumption -->
  <rect x="28" y="72" width="400" height="240" rx="8" fill="#161b22" stroke="#21262d"/>
  <text x="46" y="98" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600">
    Context Tokens Sent to LLM (~bytes / 4)
  </text>

  <text x="46" y="128" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">C11 Engine (hshield · cmd_sandbox_impl)</text>
  <rect x="46" y="136" width="320" height="16" rx="3" fill="#30363d"/>
  <rect x="46" y="136" width="320" height="16" rx="3" fill="#f85149" opacity="0.85"/>
  <text x="372" y="148" fill="#ffa198" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">36,517</text>

  <rect x="46" y="158" width="320" height="16" rx="3" fill="#21262d"/>
  <rect x="46" y="158" width="12.1" height="16" rx="3" fill="url(#accentGreen)"/>
  <text x="66" y="170" fill="#7ee787" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600">1,384 (-96.2%, 1 turn)</text>

  <text x="46" y="206" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">Python 3.12 (hveritas · validate_pinned_image_ref)</text>
  <rect x="46" y="214" width="320" height="16" rx="3" fill="#21262d"/>
  <rect x="46" y="214" width="320" height="16" rx="3" fill="#f85149" opacity="0.85"/>
  <text x="372" y="226" fill="#ffa198" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">7,453</text>

  <rect x="46" y="236" width="320" height="16" rx="3" fill="#21262d"/>
  <rect x="46" y="236" width="20.8" height="16" rx="3" fill="url(#accentGreen)"/>
  <text x="74" y="248" fill="#7ee787" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600">484 (-93.5%, 1 turn)</text>

  <text x="46" y="290" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11">
    File Skeleton (hslice -s): -94.6% on src/hshield.c · -92.7% on verifier.py
  </text>

  <!-- Right panel: Execution Latency -->
  <rect x="452" y="72" width="400" height="240" rx="8" fill="#161b22" stroke="#21262d"/>
  <text x="470" y="98" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600">
    Steady-State Wall-Clock Latency (hveritas, ms)
  </text>

  <text x="470" y="132" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">4-step find+grep+cat+grep</text>
  <rect x="470" y="140" width="320" height="16" rx="3" fill="#21262d"/>
  <rect x="470" y="140" width="320" height="16" rx="3" fill="#f85149" opacity="0.85"/>
  <text x="796" y="152" fill="#ffa198" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">33.80 ms</text>

  <text x="470" y="178" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">hslice -x (def + callers)</text>
  <rect x="470" y="186" width="320" height="16" rx="3" fill="#21262d"/>
  <rect x="470" y="186" width="83.2" height="16" rx="3" fill="url(#accentBlue)"/>
  <text x="560" y="198" fill="#a5d6ff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">8.79 ms</text>

  <text x="470" y="224" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">hslice -s (skeleton) / hslice &lt;sym&gt;</text>
  <rect x="470" y="232" width="320" height="16" rx="3" fill="#21262d"/>
  <rect x="470" y="232" width="17.9" height="16" rx="3" fill="url(#accentGreen)"/>
  <text x="494" y="244" fill="#7ee787" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600">1.89 ms / 1.35 ms</text>

  <text x="470" y="270" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">hfind / hsearch (mmap lookup)</text>
  <rect x="470" y="278" width="320" height="16" rx="3" fill="#21262d"/>
  <rect x="470" y="278" width="12.2" height="16" rx="3" fill="url(#accentGreen)"/>
  <text x="488" y="290" fill="#7ee787" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600">1.29 ms / 1.26 ms</text>
</svg>
