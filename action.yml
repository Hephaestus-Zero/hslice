name: 'Setup hslice'
description: 'Build and expose hslice, hfind, and hsearch (<2ms C11 code slicer) on PATH'
author: 'Hephaestus-Zero'
branding:
  icon: 'search'
  color: 'purple'
runs:
  using: 'composite'
  steps:
    - name: Build and install hslice tools
      shell: bash
      run: |
        set -euo pipefail
        BIN_DIR="${RUNNER_TEMP:-/tmp}/hslice-action-bin"
        mkdir -p "${BIN_DIR}"
        cc -std=c11 -O3 -Wall -Wextra -Werror \
          -I"${{ github.action_path }}/src" \
          -o "${BIN_DIR}/hslice" "${{ github.action_path }}/src/hslice.c"
        cc -std=c11 -O3 -Wall -Wextra -Werror \
          -I"${{ github.action_path }}/src" \
          -o "${BIN_DIR}/hfind" "${{ github.action_path }}/src/hfind.c"
        ln -sf hfind "${BIN_DIR}/hsearch"
        echo "${BIN_DIR}" >> "${GITHUB_PATH}"
